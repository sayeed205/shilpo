name: Publish TypeScript SDK

on:
  push:
    tags:
      - "typescript-sdk-v*"

permissions:
  contents: read

concurrency:
  group: jsr-typescript-sdk-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish @shilpo/ext-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Verify SDK tag
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${SDK_TAG#typescript-sdk-v}"
          if [[ "$tag_version" == "$SDK_TAG" || ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "SDK tag must match typescript-sdk-v<semver>; got $SDK_TAG" >&2
            exit 1
          fi
          sdk_version="$(deno eval 'const config = JSON.parse(await Deno.readTextFile("deno.json")); console.log(config.version);')"
          if [[ "$tag_version" != "$sdk_version" ]]; then
            echo "SDK tag version $tag_version does not match deno.json version $sdk_version" >&2
            exit 1
          fi

      - name: Verify generated sources
        run: deno task generate:check

      - name: Verify formatting
        run: deno task fmt:check

      - name: Verify lint
        run: deno task lint

      - name: Verify types
        run: deno task check

      - name: Run tests
        run: deno task test

      - name: Validate package boundary
        run: deno task publish:check

      - name: Require a clean source tree
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "Validation changed tracked source; refusing to publish" >&2
            exit 1
          fi

      - name: Publish to JSR
        run: deno publish
