name: Native Benchmarks

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays at 00:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: "Benchmark suite to run (core, config, wasm, all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - core
          - config
          - wasm

permissions:
  contents: read

concurrency:
  group: native-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Native Criterion Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Collect Environment Metadata
        run: |
          mkdir -p target/criterion/metadata
          cat <<EOF > target/criterion/metadata/environment.json
          {
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "event_name": "${{ github.event_name }}",
            "rust_version": "$(rustc --version)",
            "os": "$(uname -s)",
            "os_release": "$(uname -r)",
            "architecture": "$(uname -m)",
            "cpu_model": "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs || echo 'unknown')",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "fixture_identity": "tests/fixtures/sdk-component (wasm32-wasip2)"
          }
          EOF
          cat target/criterion/metadata/environment.json

      - name: Run Benchmarks
        env:
          SUITE: ${{ github.event.inputs.suite || 'all' }}
        run: |
          ./scripts/bench.sh "$SUITE"

      - name: Determine Artifact Retention Days
        id: retention
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "days=90" >> "$GITHUB_OUTPUT"
          else
            echo "days=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Criterion Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-reports-${{ github.sha }}-${{ github.run_id }}
          path: target/criterion/
          retention-days: ${{ steps.retention.outputs.days }}
          if-no-files-found: warn
