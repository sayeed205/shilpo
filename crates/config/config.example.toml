version = 1

[theme]
mode = "Dark"
accent = "#6750A4"
font_family = "sans-serif"
corner_radius_scale = 1.0

[bar]
position = "Top"
style = "Hug"
height = 48
padding = 8
widget_spacing = 6

[bar.margin]
horizontal = 180
vertical = 8

[bar.widgets]
start = ["Launcher", "Workspaces", "ActiveWindow"]
center = ["Clock", "Media"]
end = ["Sysinfo", "Network", "Audio", "Battery", "Settings"]
