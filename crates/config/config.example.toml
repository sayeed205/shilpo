version = 1

[theme]
font_family = "sans-serif"
corner_radius_scale = 1.0

[bar]
position = "Top"
style = "Hug"
height = 48
padding = 8
widget_spacing = 6
opacity = 0.92

[bar.margin]
horizontal = 180
vertical = 8

[bar.widgets]
start = ["builtin:workspaces", "builtin:running_apps"]
center = ["builtin:clock", "builtin:date", "builtin:media"]
end = ["builtin:sysinfo", "builtin:network", "builtin:bluetooth", "builtin:caffeine", "builtin:audio", "builtin:battery", "builtin:settings"]

# Extension-wide settings are delivered to every contribution from that
# extension. Add the contribution to a bar section after installing and
# enabling the extension.
#
# [extensions.settings."org.shilpo.weather"]
# location = "Kolkata"
# temperature_unit = "celsius"
# refresh_minutes = 30
# show_condition = false
#
# [bar.widgets]
# end = ["ext:org.shilpo.weather/bar"]

# Extension desktop widgets are host-owned persistent instances. `output` may
# be "primary", a stable display UUID, or a display ID reported by the shell.
#
# [[desktop.widgets]]
# instance = "home-clock"
# contribution = "ext:io.github.alice.world-clock/desktop"
# output = "primary"
# x = 32
# y = 32
# width = 320
# height = 180
