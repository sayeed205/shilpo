[package]
name = "shilpo-registry-contract"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[example]]
name = "generate_distribution_schemas"
path = "examples/generate_distribution_schemas.rs"

[features]
# Exposes a process-global override for is_pinned_official(), letting tests simulate
# a build with SHILPO_OFFICIAL_EXTENSIONS_ROOT_KEY compiled in without an actual
# release build. Must never be enabled by a normal (non-dev) dependency edge, since
# it would let any code in the same process forge official trust at runtime.
test-util = []

[dependencies]
base64.workspace = true
chrono.workspace = true
hex.workspace = true
ring.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shilpo-ext-api.workspace = true
