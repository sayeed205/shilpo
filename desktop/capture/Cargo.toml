[package]
name = "shilpo-capture"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = []
ocr = ["dep:tesseract", "dep:leptonica-sys"]

[dependencies]
serde.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
image.workspace = true
wayland-client.workspace = true
wayland-backend.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true

ffmpeg.workspace = true
ffmpeg-sys.workspace = true
pipewire.workspace = true
spa = { package = "libspa", version = "0.10" }

crossbeam-channel = "0.5"
parking_lot = "0.12"
crossbeam-utils = "0.8"

tesseract = { version = "0.15", optional = true }
leptonica-sys = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
