[package]
name = "shilpo-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
default-run = "shilpo"

[[bin]]
name = "shilpo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
chrono.workspace = true
dirs.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
shilpo-services.workspace = true
shilpo-config.workspace = true
shilpo-theme.workspace = true
shilpo-theme-daemon.workspace = true
shilpo-ext.workspace = true
