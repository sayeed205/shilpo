[package]
name = "storybook"
version = "0.1.0"
publish = false
edition.workspace = true

[features]
inspector = ["shilpo-ui/inspector"]
tree-sitter = ["shilpo-ui/tree-sitter-languages"]
default = ["tree-sitter"]

[dependencies]
anyhow.workspace = true
futures-lite.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
shilpo-ui = { workspace = true }
log.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
reqwest.workspace = true
wasm-bindgen-futures = "0.4"

autocorrect = "2"
chrono = "0.4"
csv = "1"
fake = { version = "5", features = ["dummy"] }
itertools = "0.15"
lsp-types.workspace = true
rand = "0.10"
regex = "1"
serde = "1"
serde_json = "1"
tracing.workspace = true
tokio.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"], default-features = false }
unindent = "0.2"
rust-i18n.workspace = true
dirs = "6"

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest_client.workspace = true
smol.workspace = true
tree-sitter-navi = "0.2"
color-lsp = "0.2"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
shilpo-theme-daemon.workspace = true

[lints]
workspace = true
