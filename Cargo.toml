[workspace]
members = [
    # Cross-platform core crates
    "core/ui",
    "core/theme",
    "core/macros",
    "core/ext-api",
    # Linux desktop shell crates
    "desktop/shilpo",
    "desktop/device",
    "desktop/services",
    "desktop/ext-runtime",
    "desktop/theme-daemon",
    "desktop/observability",
    # Other
    "apps/storybook",
]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
shilpo = { path = "desktop/shilpo" }
shilpo-ui = { path = "core/ui" }
shilpo-theme = { path = "core/theme" }
shilpo-macros = { path = "core/macros" }
shilpo-ext-api = { path = "core/ext-api" }
shilpo-device = { path = "desktop/device" }
shilpo-services = { path = "desktop/services" }
shilpo-ext-runtime = { path = "desktop/ext-runtime" }
shilpo-theme-daemon = { path = "desktop/theme-daemon" }
shilpo-observability = { path = "desktop/observability" }
tracing-chrome = "0.7"
arc-swap = "1"
roxmltree = "0.21"

niri-ipc = "26"
zbus = { version = "5", features = ["p2p"] }
zvariant = "5"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings", "screencast", "screenshot"] }
futures-lite = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-udev = "0.10"
chrono = "0.4"

wayland-client = "0.31"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["staging", "unstable"] }
wayland-protocols-wlr = "0.3"
libc = "0.2"

drm = "0.15"
mio = { version = "1", features = ["os-poll", "os-ext"] }

gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
gpui_web = { git = "https://github.com/zed-industries/zed" }
sum-tree = { version = "0.2", package = "zed-sum-tree" }

anyhow = "1"
dirs = "6"
log = "0.4"
lsp-types = { version = "0.97", features = ["proposed"] }
notify = "8"
notify-rust = "4"
raw-window-handle = "0.6"
ropey = { version = "2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
rust-i18n = "4"
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_repr = "0.1"
semver = { version = "1", features = ["serde"] }
smallvec = "1"
flate2 = "1"
tar = "0.4"
toml = "1"
base64 = "0.23"
hex = "0.4"
ring = "0.17"
sha2 = "0.11"
smol = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = "1"
wasm-bindgen = "0.2"
errno = { version = "0.3", default-features = false }
mcu-material-color = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
freedesktop-icons = "0.4"
resvg = "0.48"
sysinfo = "0.39"
jsonschema = { version = "0.49", default-features = false }
wasmtime = { version = "47", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
    "wat",
] }
wasmtime-wasi = { version = "47.0.2", default-features = false, features = ["p2"] }
libpulse-binding = "2"
ddc = "0.2"
ddc-i2c = { version = "0.2", features = ["i2c-linux"] }
proptest = "1"
heed = "0.22"

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.62"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
useless_conversion = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
sum_tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
reqwest_client = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

[workspace.metadata.typos.default.extend-identifiers]
consts = "consts"

[workspace.metadata.cargo-machete]
ignored = ["log", "anyhow", "serde"]

# Patches for WASM compatibility
[patch.crates-io]
# Use stacker's psm version which may have better WASM support
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }
